<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Astilla">
<meta name="theme-color" content="#0b0d14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Astilla</title>
<style>
/* ---------- Farben ---------- */
:root{
  color-scheme:light;
  --label:#0b0d14;--label2:rgba(20,24,40,.62);--label3:rgba(20,24,40,.32);
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.72);--glass-edge:rgba(255,255,255,.75);
  --glass-shadow:0 10px 34px rgba(60,72,140,.16);--glass-hi:rgba(255,255,255,.9);
  --sep:rgba(20,24,40,.10);--fill:rgba(120,120,140,.16);--solid:#ffffff;--knob:#ffffff;
  --blue:#007aff;--green:#30c25a;--orange:#ff9500;--red:#ff3b30;--gray:#8e8e93;
  --bg0:#eaf0ff;
  --blob1:rgba(0,122,255,.38);--blob2:rgba(175,82,222,.30);--blob3:rgba(52,199,189,.34);--blob4:rgba(255,149,0,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --label:#ffffff;--label2:rgba(235,238,255,.66);--label3:rgba(235,238,255,.34);
    --glass:rgba(38,42,60,.46);--glass-strong:rgba(50,55,78,.62);--glass-edge:rgba(255,255,255,.16);
    --glass-shadow:0 12px 38px rgba(0,0,0,.45);--glass-hi:rgba(255,255,255,.22);
    --sep:rgba(255,255,255,.10);--fill:rgba(160,165,200,.20);--solid:#2a2d3e;--knob:#3a3d52;
    --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
    --bg0:#07080e;
    --blob1:rgba(10,132,255,.42);--blob2:rgba(140,70,230,.38);--blob3:rgba(20,170,160,.26);--blob4:rgba(255,120,60,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --label:#ffffff;--label2:rgba(235,238,255,.66);--label3:rgba(235,238,255,.34);
  --glass:rgba(38,42,60,.46);--glass-strong:rgba(50,55,78,.62);--glass-edge:rgba(255,255,255,.16);
  --glass-shadow:0 12px 38px rgba(0,0,0,.45);--glass-hi:rgba(255,255,255,.22);
  --sep:rgba(255,255,255,.10);--fill:rgba(160,165,200,.20);--solid:#2a2d3e;--knob:#3a3d52;
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --bg0:#07080e;
  --blob1:rgba(10,132,255,.42);--blob2:rgba(140,70,230,.38);--blob3:rgba(20,170,160,.26);--blob4:rgba(255,120,60,.16);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg0)}
body{margin:0;color:var(--label);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 112px)}
/* Hintergrund mit farbigen Lichtflecken, damit das Glas etwas zum Brechen hat */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 40% at 12% 8%,var(--blob1),transparent 70%),
  radial-gradient(55% 38% at 95% 22%,var(--blob2),transparent 70%),
  radial-gradient(60% 40% at 8% 62%,var(--blob3),transparent 70%),
  radial-gradient(55% 38% at 92% 92%,var(--blob4),transparent 70%),
  var(--bg0)}
#app{max-width:560px;margin:0 auto}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;margin:18px 0 2px}
.sub{color:var(--label2);font-size:15px;margin-bottom:8px}
.sec{font-size:13px;text-transform:uppercase;color:var(--label2);margin:24px 18px 8px;letter-spacing:.3px;font-weight:500}
.foot{font-size:13px;color:var(--label2);margin:8px 18px 0;line-height:1.4}

/* ---------- Liquid Glass ---------- */
.glass,.group,.hero,.tabbar,.seg,.alert,.ok-msg{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.06);
}
.group,.hero{border-radius:26px;position:relative;overflow:hidden}
/* Lichtreflex oben links */
.group::after,.hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 38%)}
.row,.field{position:relative;z-index:1}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:11px 18px}
.row+.row::before,.row+.field::before,.field+.field::before,.field+.row::before,.seg+.chartbox+.row::before{content:"";position:absolute;top:0;left:18px;right:0;height:.5px;background:var(--sep)}
.row .k{flex:1 1 auto;min-width:0}
.row .v{flex:0 1 auto;min-width:0;color:var(--label2);text-align:right}
.row .v.strong{color:var(--label);font-weight:600}
.row small{display:block;color:var(--label2);font-size:13px;margin-top:1px;line-height:1.3}
.row .l{display:flex;align-items:center;flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:12px;flex:none;box-shadow:0 0 8px currentColor}

.hero{padding:26px 20px 24px;text-align:center;margin-top:12px}
.hero>*{position:relative;z-index:1}
.badge{--c:var(--gray);width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:700;line-height:1;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.7),rgba(255,255,255,0) 46%),var(--c);
  box-shadow:0 10px 30px color-mix(in srgb,var(--c) 55%,transparent),inset 0 2px 3px rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.14)}
.badge.green{--c:var(--green)}.badge.orange{--c:var(--orange)}.badge.red{--c:var(--red)}.badge.gray{--c:var(--gray)}.badge.blue{--c:var(--blue)}
.hero b{display:block;font-size:27px;font-weight:700;letter-spacing:.2px}
.hero span{display:block;color:var(--label2);font-size:15px;margin-top:6px}

.chk{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex:none;margin-right:12px}
.chk.ok{background:var(--green);box-shadow:0 2px 10px color-mix(in srgb,var(--green) 55%,transparent),inset 0 1px 1px rgba(255,255,255,.5)}
.chk.no{background:var(--fill);color:var(--label2)}

.seg{display:flex;border-radius:999px;padding:3px;margin:14px 16px 4px;position:relative;z-index:1}
.seg button{flex:1;border:0;background:transparent;color:var(--label);font:inherit;font-size:13px;font-weight:500;padding:7px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-hi);font-weight:600}
.chartbox{padding:8px 6px 0;position:relative;z-index:1}
svg{width:100%;height:auto;display:block}
svg text{font:10px -apple-system,system-ui,sans-serif;fill:var(--label2)}

button.btn{display:block;width:100%;border:0;border-radius:999px;color:#fff;font:inherit;font-weight:600;padding:12px 16px;margin-top:12px;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 80%,#fff),var(--blue));
  box-shadow:0 8px 24px color-mix(in srgb,var(--blue) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.55)}
button.btn:active{transform:scale(.98);opacity:.85}
button.btn.sec2{color:var(--blue);background:var(--glass);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
button.link{border:0;background:none;color:var(--blue);font:inherit;padding:4px 0 4px 10px;cursor:pointer}
button.link.del{color:var(--red)}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:6px 18px}
.field label{flex:none;max-width:58%}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--label);font:inherit;text-align:right;padding:8px 0;outline:none}
.field input::placeholder{color:var(--label3)}

.alert,.ok-msg{border-radius:20px;padding:13px 16px;font-size:14px;margin:14px 0 0;line-height:1.4}
.alert{color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--glass))}
.alert b{display:block;margin-bottom:3px}
.errc{cursor:pointer;padding:10px 14px;font-size:13px}
.errc b{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.errc b em{font-style:normal;font-weight:600;opacity:.75;font-size:12.5px}
.alert small{display:block;opacity:.8;margin-top:6px;font-size:12px}
.ok-msg{color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--glass))}
.empty{text-align:center;color:var(--label2);padding:40px 16px}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green))}
.bar.full i{background:var(--red)}

/* ---------- schwebende Tab-Leiste ---------- */
.tabbar{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom) + 10px);
  border-radius:999px;display:flex;gap:2px;padding:6px;z-index:10}
.tabbar button{flex:1;border:0;background:none;color:var(--label2);font:inherit;font-size:10px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;cursor:pointer}
.tabbar button.on{color:var(--blue);background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 10px rgba(0,0,0,.14)}
.tabbar svg{width:24px;height:24px;margin:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- Runterziehen zum Neuladen ---------- */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:19;transform:translate(-50%,-80px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:24px;font-size:14px;font-weight:600;color:var(--label);white-space:nowrap;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.ptr i{width:18px;height:18px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--blue);flex:none;transition:transform .2s}
.ptr.ready i{transform:rotate(180deg);border-top-color:var(--green)}
.ptr.spin i{animation:spin .8s linear infinite}
html{overscroll-behavior-y:contain}
/* kompakter Status, wenn Daten da sind */
.hero.compact{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;margin-top:8px;border-radius:20px}
.hero.compact .badge{width:38px;height:38px;font-size:20px;margin:0;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 50%,transparent),inset 0 1px 2px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.12)}
.hero.compact b{font-size:17px}
.hero.compact span{font-size:13px;margin-top:1px;line-height:1.3}
.pricehead{position:relative;z-index:1;padding:14px 16px 0 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{--c:var(--gray);display:inline-flex;align-items:center;gap:7px;padding:7px 12px;margin-top:4px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;color:var(--c);cursor:pointer;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pricehead>div{flex:none}
.pill{flex:0 1 auto;min-width:0;max-width:100%}
.pill span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill em{flex:none}
@media (max-width:400px){.pill{gap:6px;padding:7px 10px;font-size:12px}.pill em{display:none}}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill em{font-style:normal;opacity:.7;transition:transform .2s;display:inline-block}
.pill.open em{transform:rotate(90deg)}
.pill:active{opacity:.7}
.infopanel{position:relative;z-index:1;margin:10px 14px 0;padding:14px 16px;border-radius:20px;background:var(--fill);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.infopanel>b{display:block;font-size:17px}
.infopanel>p{margin:3px 0 8px;color:var(--label2);font-size:14px;line-height:1.35}
.crow{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.crow .chk{width:22px;height:22px;font-size:12px;margin:1px 0 0}
.crow small{display:block;color:var(--label2);font-size:12.5px;line-height:1.3}
.infopanel .note{margin:8px 0 0;padding-top:8px;border-top:.5px solid var(--sep);font-size:12.5px;color:var(--label2);line-height:1.35}
.legend{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px 18px;padding:2px 18px 14px;font-size:13px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--label);font-weight:600}
.pricehead .big{font-size:38px;font-weight:700;letter-spacing:.2px;line-height:1.1}
.pricehead .big small{font-size:17px;font-weight:600;color:var(--label2);margin-left:6px}
.pricehead .chg{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap}
.pricehead .asof{font-size:12.5px;color:var(--label2);margin-top:1px;white-space:nowrap}
.pricehead .chg.up{color:var(--green)}.pricehead .chg.down{color:var(--red)}.pricehead .chg span{color:var(--label2);font-weight:500}
/* ---------- Meldung oben (Toast) ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:20;width:max-content;max-width:calc(100vw - 32px);
  display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:26px;font-size:15px;font-weight:600;line-height:1.25;color:var(--label);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.toast i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff;flex:none}
.toast.ok i{background:var(--green)}.toast.err i{background:var(--red)}
.toast.busy i{background:transparent;border:3px solid var(--fill);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_VERSION = '20261125213347';
const KEY = 'astilla.v1', DAY = 86400000, FREE_LIMIT = 25, YAHOO_TTL = 15 * 60000;
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const num = (v, d = 2) => Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const dt = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
const dtl = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
const monShort = d => d.toLocaleDateString('de-DE', { month: 'short' });
const stamp = ms => new Date(ms).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

const PROV = {
  repo:   { name: 'Kursdatei (GitHub)', needsKey: false },
  yahoo:  { name: 'Yahoo Finance', needsKey: false },
  twelve: { name: 'Twelve Data',   needsKey: true },
  alpha:  { name: 'Alpha Vantage', needsKey: true }
};
const ORDER = ['repo', 'yahoo', 'twelve', 'alpha'];
const sigOf = sym => [sym.yahoo, sym.twelve, sym.alpha].join('|');

function defaults() {
  return {
    settings: { provider: 'auto', keys: { twelve: '', alpha: '' }, sym: { yahoo: '', twelve: '', alpha: '' }, name: '',
                budget: 1000, tolUp: 1, tolDown: 3, pullback: 1, theme: 'dark', lastBackup: 0 },
    cache: { fetched: '', at: 0, checkedAt: 0, source: '', via: '', sig: '', daily: [], weekly: [], error: '', detail: '', limits: {}, liveTime: 0, currency: '' },
    usage: { date: '', n: 0 },
    log: []
  };
}
function load() {
  const b = defaults();
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) {
      const s = d.settings || {};
      Object.assign(b.settings, s);
      b.settings.keys = Object.assign({ twelve: '', alpha: '' }, s.keys || {});
      b.settings.sym = Object.assign({ yahoo: '', twelve: '', alpha: '' }, s.sym || {});
      /* alte Version: ein Schlüssel und ein Symbol für Alpha Vantage */
      if (s.apiKey && !b.settings.keys.alpha) b.settings.keys.alpha = s.apiKey;
      if (s.symbol && !b.settings.sym.alpha) b.settings.sym.alpha = s.symbol;
      Object.assign(b.cache, d.cache || {});
      b.cache.limits = Object.assign({}, (d.cache && d.cache.limits) || {});
      if (d.cache && d.cache.limitDate && !b.cache.limits.alpha) b.cache.limits.alpha = d.cache.limitDate;
      if (d.cache && d.cache.symbol && d.cache.symbol === s.symbol && !b.cache.sig) { b.cache.sig = sigOf(b.settings.sym); b.cache.source = b.cache.source || 'alpha'; }
      /* Twelve-Daten ohne Börse stammen vermutlich von einem falschen Wertpapier (z. B. US-SPYI): verwerfen */
      if (b.cache.source === 'twelve' && !String(b.settings.sym.twelve || '').includes(':')) {
        b.cache.daily = []; b.cache.weekly = []; b.cache.fetched = ''; b.cache.at = 0; b.cache.checkedAt = 0; b.cache.source = ''; b.cache.sig = '';
      }
      Object.assign(b.usage, d.usage || {});
      b.log = Array.isArray(d.log) ? d.log : [];
    }
  } catch (e) {}
  return b;
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

let S = load();
let errOpen = false, infoOpen = false, view = 'heute', busy = false, msg = '', msgType = 'ok', results = [], range = 60;

function applyTheme() {
  const t = S.settings.theme, el = document.documentElement;
  if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); else el.removeAttribute('data-theme');
}

let toastTimer = 0, toastPrefix = '';
function toast(text, kind, ms) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  clearTimeout(toastTimer);
  el.className = 'toast ' + (kind || 'ok');
  el.innerHTML = '<i>' + (kind === 'ok' ? '✓' : kind === 'err' ? '!' : '') + '</i><span>' + esc(text) + '</span>';
  void el.offsetWidth;
  el.classList.add('show');
  if (kind !== 'busy') toastTimer = setTimeout(() => el.classList.remove('show'), ms || 3200);
  if (navigator.vibrate) { try { navigator.vibrate(kind === 'err' ? [20, 40, 20] : 12); } catch (e) {} }
}

/* Anfragen-Zähler für Alpha Vantage (nur dieses Gerät) */
function bump() {
  const t = ds(today());
  if (S.usage.date !== t) S.usage = { date: t, n: 0 };
  S.usage.n++;
  save();
}
const usedToday = () => (S.usage.date === ds(today()) ? S.usage.n : 0);

function windowOf(d) {
  const y = d.getFullYear(), m = d.getMonth(), last = new Date(y, m + 1, 0).getDate(), base = ds(d).slice(0, 7);
  return d.getDate() <= 15
    ? { key: base + '-A', start: new Date(y, m, 1), end: new Date(y, m, 15) }
    : { key: base + '-B', start: new Date(y, m, 16), end: new Date(y, m, last) };
}

/* Summe aller Käufe im laufenden Monat und ob das Monatsbudget schon erreicht ist */
function monthTotal() {
  const key = ds(today()).slice(0, 7);
  return S.log.reduce((s, e) => s + (String(e.date).slice(0, 7) === key ? e.amount : 0), 0);
}
const budgetReached = () => monthTotal() >= S.settings.budget - 0.5;

function sma(arr, n, i) {
  if (i < n - 1) return null;
  let s = 0;
  for (let k = i - n + 1; k <= i; k++) s += arr[k].c;
  return s / n;
}

function analyze() {
  const { daily, weekly } = S.cache;
  if (daily.length < 50 || weekly.length < 31) return null;
  const L = daily.length - 1, close = daily[L].c;
  const s20 = sma(daily, 20, L), s50 = sma(daily, 50, L);
  const w30 = weekly.map((_, i) => sma(weekly, 30, i));
  const W = weekly.length - 1;
  const w30now = w30[W], w30prev = w30[W - 1];
  const trendUp = w30now > w30prev;
  const dist = (close - s20) / s20 * 100;
  const recentHigh = Math.max(...daily.slice(-10).map(x => x.c));
  const pull = (close / recentHigh - 1) * 100;
  const near = dist <= S.settings.tolUp && dist >= -S.settings.tolDown;
  const pulled = pull <= -S.settings.pullback;
  const green = trendUp && near && pulled;
  return { close, s20, s50, w30, w30now, trendUp, dist, pull, near, pulled, green };
}

function prevBusinessDay(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
  while (x.getDay() === 0 || x.getDay() === 6) x.setDate(x.getDate() - 1);
  return x;
}
/* Daten sind alt, wenn der letzte Kurs älter ist als der letzte Handelstag vor heute */
function staleData() {
  const D = S.cache.daily;
  return D.length > 0 && D[D.length - 1].d < ds(prevBusinessDay(today()));
}
function lastDataDate() {
  const D = S.cache.daily;
  return D.length ? parseD(D[D.length - 1].d).toLocaleDateString('de-DE') : '';
}

function status(a) {
  const t = today(), win = windowOf(t);
  const bought = S.log.find(e => e.window === win.key);
  const lastDay = ds(t) === ds(win.end);
  if (budgetReached()) {
    const sumTxt = num(monthTotal(), 0) + ' von ' + num(S.settings.budget, 0) + ' €';
    if (a && !staleData() && a.green)
      return { short: 'Optional', color: 'green', icon: '✓', title: 'Budget erreicht, Kauf optional',
               text: 'Diesen Monat hast du schon ' + sumTxt + ' gekauft. Das Signal steht trotzdem auf Kaufen. Du kannst zusätzlich kaufen, musst aber nicht.' };
    return { short: 'Budget erreicht', color: 'blue', icon: '✓', title: 'Monatsbudget erreicht',
             text: 'Diesen Monat hast du ' + sumTxt + ' gekauft. Kein Zwangskauf mehr. Ein Kauf wäre nur freiwillig, wenn das Signal auf Kaufen springt.' };
  }
  if (bought) return { short: 'Erledigt', color: 'blue', icon: '✓', title: 'Erledigt', text: 'In diesem Zeitfenster hast du schon gekauft.' };
  if (busy && !a) return { short: 'Lädt …', color: 'blue', icon: '…', title: 'Lädt Kurse …', text: 'Einen Moment bitte.' };
  /* Zwangskauf-Hinweis hängt nur vom Datum ab und kommt auch ohne oder mit alten Kursdaten */
  if (lastDay && (!a || staleData()))
    return { short: 'Heute kaufen', color: 'orange', icon: '!', title: 'Letzter Tag',
             text: 'Heute endet das Zeitfenster. Kaufe heute, auch ohne Signal. ' + (a ? 'Die Kursdaten sind alt (vom ' + lastDataDate() + ').' : 'Kursdaten fehlen gerade.') };
  if (!a) return { short: 'Keine Daten', color: 'gray', icon: '…', title: 'Keine Daten', text: 'Kursdaten fehlen noch. Prüfe unten die Datenquelle.' };
  if (staleData()) return { short: 'Daten alt', color: 'gray', icon: '!', title: 'Daten sind alt', text: 'Der letzte Kurs ist vom ' + lastDataDate() + '. Ziehe die Seite nach unten zum Aktualisieren, bevor du entscheidest.' };
  if (a.green) return { short: 'Kaufen', color: 'green', icon: '✓', title: 'Jetzt kaufen', text: 'Der Trend steigt und der Kurs hat nach einem Rücksetzer die 20-Tage-Linie erreicht.' };
  if (lastDay) return { short: 'Heute kaufen', color: 'orange', icon: '!', title: 'Letzter Tag', text: 'Heute endet das Zeitfenster. Kaufe heute, auch ohne Signal.' };
  if (!a.trendUp) return { short: 'Trend fällt', color: 'red', icon: '↓', title: 'Trend fällt', text: 'Die 30-Wochen-Linie fällt. Warte, bis das Fenster endet.' };
  return { short: 'Warten', color: 'orange', icon: '…', title: 'Noch warten', text: 'Der Trend ist gut, aber der Kurs ist noch nicht zurückgekommen.' };
}

/* ---------- Datenquellen ---------- */
function limitError(detail) { const e = new Error('limit'); e.limit = true; e.detail = detail || ''; return e; }
function limitText(detail, p) {
  const m = (detail || '').toLowerCase();
  if (m.includes('per minute') || m.includes('minute') || m.includes('burst'))
    return 'Zu viele Anfragen in kurzer Zeit. Eine Minute warten.';
  return 'Tageslimit erreicht.';
}

/* Direkt abfragen. Klappt das nicht (CORS, Sperre, Limit), nacheinander über öffentliche Proxys. */
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + enc(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + enc(u)
];
const short = e => (e instanceof TypeError ? 'blockiert/offline' : String(e.message || e).slice(0, 60));
async function fetchJSON(url, proxyOK) {
  const tries = [['direkt', url, '']];
  if (proxyOK) PROXIES.forEach((f, i) => tries.push(['Proxy ' + (i + 1), f(url), 'Proxy']));
  const errs = [];
  for (const [label, u, via] of tries) {
    try {
      const r = await fetch(u);
      if (!r.ok) {
        let m = '';
        try { const j = await r.json(); m = j.message || j.Information || j.Note || (j.error && (j.error.message || j.error)) || ''; } catch (e2) {}
        if (r.status === 429) throw limitError(m);
        throw new Error('HTTP ' + r.status + (m ? ': ' + clean(m).slice(0, 140) : ''));
      }
      return { j: await r.json(), via };
    } catch (e) {
      /* Bei normalen API-Fehlern (z. B. 404) lohnt sich kein weiterer Weg nicht, bei Sperren schon */
      errs.push(label + ': ' + short(e));
      if (!proxyOK) throw e;
    }
  }
  const e = new Error(errs.join(', ')); e.multi = true; throw e;
}

const clean = s => String(s || '').replace(/\*\*/g, '').replace(/\s*Please provide[^.]*\.?.*$/i, '').trim();
function dedupe(list) {
  const m = new Map();
  list.forEach(x => m.set(x.d, x));
  return [...m.values()].sort((a, b) => a.d < b.d ? -1 : 1);
}

/* Yahoo Finance: ohne Schlüssel, aktueller Kurs steckt im letzten Tagesbalken */
async function yahooSeries(sym, range, interval) {
  const path = '/v8/finance/chart/' + enc(sym) + '?range=' + range + '&interval=' + interval + '&includePrePost=false';
  let j, via, lastErr;
  for (const host of ['query1', 'query2']) {
    try { ({ j, via } = await fetchJSON('https://' + host + '.finance.yahoo.com' + path, true)); lastErr = null; break; }
    catch (e) { lastErr = e; }
  }
  if (lastErr) throw lastErr;
  const res = j && j.chart && j.chart.result && j.chart.result[0];
  if (!res) throw new Error((j && j.chart && j.chart.error && j.chart.error.description) || 'Symbol bei Yahoo unbekannt');
  const off = (res.meta && res.meta.gmtoffset) || 0, ts = res.timestamp || [];
  const cl = ((res.indicators && res.indicators.quote && res.indicators.quote[0]) || {}).close || [];
  const out = [];
  ts.forEach((t, i) => {
    const c = cl[i];
    if (c == null || !isFinite(c)) return;
    const d = new Date((t + off) * 1000);
    out.push({ d: d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()), c });
  });
  return { series: dedupe(out), meta: res.meta || {}, via };
}
async function fromYahoo(sym) {
  const d = await yahooSeries(sym, '1y', '1d');
  const w = await yahooSeries(sym, '2y', '1wk');
  return { daily: d.series, weekly: w.series, via: d.via, liveTime: (d.meta.regularMarketTime || 0) * 1000, currency: d.meta.currency || '' };
}

/* Twelve Data: Schlüssel nötig, Gratis-Plan hat Limits und nicht jede Börse */
async function twelveSeries(sym, key, interval, size) {
  const parts = sym.split(':');
  const base = 'https://api.twelvedata.com/time_series?symbol=' + enc(parts[0]);
  const tail = '&interval=' + interval + '&outputsize=' + size + '&apikey=' + enc(key);
  /* Die Börse als Börsen-Code (mic_code) probieren, danach als Börsenname (exchange) */
  const variants = parts[1] ? ['&mic_code=' + enc(parts[1]), '&exchange=' + enc(parts[1])] : [''];
  let last;
  for (const v of variants) {
    try {
      const { j } = await fetchJSON(base + v + tail, false);
      if (j.status === 'error') {
        if (j.code === 429) throw limitError(j.message);
        throw new Error(clean(j.message) || 'Fehler bei Twelve Data');
      }
      return dedupe((j.values || []).map(x => ({ d: String(x.datetime).slice(0, 10), c: parseFloat(x.close) })).filter(x => isFinite(x.c)));
    } catch (e) { if (e.limit) throw e; last = e; }
  }
  throw last;
}
async function fromTwelve(sym, key) {
  if (!sym.includes(':')) throw new Error('Börse fehlt. Trage das Symbol mit Börse ein, z. B. SPYI:XETR. Ohne Börse liefert Twelve Data ein US-Wertpapier mit gleichem Kürzel.');
  const daily = await twelveSeries(sym, key, '1day', 120);
  const weekly = await twelveSeries(sym, key, '1week', 60);
  return { daily, weekly, via: '', liveTime: 0, currency: '' };
}

/* Kursdatei: eine GitHub-Automatik holt die Kurse bei Yahoo und legt sie als quotes.json neben die App. */
async function fromRepo(sym) {
  const r = await fetch('quotes.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('Kursdatei noch nicht vorhanden (HTTP ' + r.status + ')');
  const j = await r.json();
  const q = j.symbols && j.symbols[sym];
  if (!q) throw new Error('Symbol ' + sym + ' steht nicht in der Kursdatei');
  return { daily: q.daily, weekly: q.weekly, via: '', liveTime: q.liveTime || 0, currency: q.currency || '', dataAt: j.updated ? Date.parse(j.updated) : 0 };
}

/* Alpha Vantage */
async function av(fn, sym, key, extra) {
  const url = 'https://www.alphavantage.co/query?function=' + fn + '&symbol=' + enc(sym) + (extra || '') + '&apikey=' + enc(key);
  bump();
  const { j } = await fetchJSON(url, false);
  if (j['Error Message']) throw new Error('Symbol unbekannt');
  if (j.Note || j.Information) throw limitError(j.Note || j.Information);
  const series = j['Time Series (Daily)'] || j['Weekly Time Series'];
  if (!series) throw new Error('Keine Daten erhalten');
  return Object.keys(series).sort().map(d => ({ d, c: parseFloat(series[d]['4. close']) })).filter(x => isFinite(x.c));
}
async function fromAlpha(sym, key) {
  const daily = await av('TIME_SERIES_DAILY', sym, key, '&outputsize=compact');
  await new Promise(r => setTimeout(r, 1500));
  const weekly = await av('TIME_SERIES_WEEKLY', sym, key, '');
  return { daily, weekly, via: '', liveTime: 0, currency: '' };
}

function available(p) {
  const st = S.settings;
  if (p === 'repo') return !!st.sym.yahoo;
  return !!st.sym[p] && (!PROV[p].needsKey || !!st.keys[p]);
}
function order() {
  const st = S.settings;
  return (st.provider === 'auto' ? ORDER : [st.provider]).filter(available);
}
function fetchSource(p) {
  const st = S.settings;
  if (p === 'repo') return fromRepo(st.sym.yahoo);
  if (p === 'yahoo') return fromYahoo(st.sym.yahoo);
  if (p === 'twelve') return fromTwelve(st.sym.twelve, st.keys.twelve);
  return fromAlpha(st.sym.alpha, st.keys.alpha);
}
const anyLimitToday = () => Object.values(S.cache.limits || {}).some(v => v === ds(today()));

async function refresh(force) {
  const st = S.settings, list = order(), sig = sigOf(st.sym);
  let c = S.cache;
  if (!list.length) { c.error = 'Bitte in den Einstellungen eine Datenquelle einrichten.'; c.detail = ''; render(); return; }
  const same = c.sig === sig && c.daily.length;
  if (!force && same) {
    const fresh = (c.source === 'yahoo' || c.source === 'repo') ? Date.now() - (c.checkedAt || c.at) < YAHOO_TTL : c.fetched === ds(today());
    if (fresh) { render(); return; }
  }
  if (busy) return;
  busy = true; render();
  if (force) toast(toastPrefix + 'lade Kurse …', 'busy');
  const errs = []; let detail = '';
  for (const p of list) {
    if (!force && c.limits[p] === ds(today())) { errs.push(PROV[p].name + ': Limit heute erreicht'); continue; }
    try {
      const r = await fetchSource(p);
      if (r.daily.length < 2) throw new Error('Zu wenige Kursdaten');
      let dev = '';
      if (c.sig === sig && c.daily.length) {
        const prev = c.daily[c.daily.length - 1].c, nowp = r.daily[r.daily.length - 1].c;
        if (prev > 0 && (nowp / prev > 1.35 || nowp / prev < 0.74)) dev = 'Kurs weicht stark vom vorigen Stand ab (' + num(prev) + ' → ' + num(nowp) + '). Prüfe das Symbol.';
      }
      const limits = Object.assign({}, c.limits); limits[p] = '';
      S.cache = { fetched: ds(today()), at: r.dataAt || Date.now(), checkedAt: Date.now(), source: p, via: r.via || '', sig, daily: r.daily, weekly: r.weekly,
                  error: '', detail: '', limits, liveTime: r.liveTime || 0, currency: r.currency || '' };
      busy = false; save(); render();
      if (dev) toast(dev, 'err', 7000);
      else if (force) toast(toastPrefix + 'Kurse geladen (' + PROV[p].name + (r.via ? ', Proxy' : '') + ')', 'ok');
      toastPrefix = ''; return;
    } catch (err) {
      if (err.limit) { c.limits[p] = ds(today()); detail = err.detail; errs.push(PROV[p].name + ': ' + limitText(err.detail, p)); }
      else errs.push(PROV[p].name + ': ' + (err instanceof TypeError ? 'Verbindung nicht möglich (offline oder blockiert)' : err.message));
    }
  }
  if (c.sig !== sig) { c.daily = []; c.weekly = []; c.fetched = ''; c.source = ''; c.at = 0; c.sig = sig; }
  c.error = errs.join('\n') + (c.daily.length ? '\nAngezeigt wird der letzte gespeicherte Stand.' : '');
  c.detail = detail;
  busy = false; save(); render();
  if (force) toast(toastPrefix + 'Abruf fehlgeschlagen, Details auf „Heute“', 'err', 5000);
  toastPrefix = '';
}

async function search(src, q) {
  const st = S.settings;
  if (!q.trim()) return;
  try {
    if (src === 'yahoo') {
      const { j } = await fetchJSON('https://query2.finance.yahoo.com/v1/finance/search?q=' + enc(q) + '&quotesCount=8&newsCount=0', true);
      results = (j.quotes || []).filter(x => x.symbol).slice(0, 8).map(x => ({ src, symbol: x.symbol, name: x.longname || x.shortname || x.symbol, region: x.exchDisp || x.exchange || '', currency: '' }));
    } else {
      if (!st.keys.alpha) { msg = 'Bitte zuerst den Alpha-Vantage-Schlüssel eintragen und speichern.'; msgType = 'err'; render(); return; }
      bump();
      const { j } = await fetchJSON('https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords=' + enc(q) + '&apikey=' + enc(st.keys.alpha), false);
      if (j.Note || j.Information) throw limitError(j.Note || j.Information);
      results = (j.bestMatches || []).slice(0, 8).map(m => ({ src, symbol: m['1. symbol'], name: m['2. name'], region: m['4. region'], currency: m['8. currency'] }));
    }
    if (!results.length) { msg = 'Keine Treffer.'; msgType = 'err'; }
  } catch (err) { results = []; msg = err.limit ? 'Limit erreicht. ' + limitText(err.detail) : 'Suche fehlgeschlagen: ' + err.message; msgType = 'err'; }
  render();
}

function buy() {
  const p = parseFloat(document.getElementById('bp').value.replace(',', '.'));
  const amt = parseFloat(document.getElementById('ba').value.replace(',', '.'));
  if (!(p > 0) || !(amt > 0)) { msg = 'Bitte Kurs und Betrag prüfen.'; msgType = 'err'; render(); return; }
  const t = today(), win = windowOf(t);
  const extra = budgetReached();
  if (!extra && S.log.some(e => e.window === win.key)) { msg = 'Für dieses Fenster gibt es schon einen Kauf.'; msgType = 'err'; render(); return; }
  const first = S.cache.daily.find(x => { const d = parseD(x.d); return d >= win.start && d <= win.end; });
  S.log.push({ id: Date.now(), date: ds(t), window: extra ? 'extra-' + Date.now() : win.key, price: p, amount: amt, shares: amt / p, firstPrice: first ? first.c : p });
  save(); msg = ''; render(); toast('Kauf gespeichert ✓', 'ok');
}

function saveSettings() {
  const g = id => (document.getElementById(id) || { value: '' }).value.replace(',', '.');

  st.keys.alpha = g('key').trim();
  st.keys.twelve = g('tkey').trim();

  st.sym.twelve = g('tsym').trim();
  st.sym.alpha = g('asym').trim();

  st.tolUp = parseFloat(g('tu')) || 0;
  st.tolDown = parseFloat(g('td')) || 0;

  if (!order().length) { toast('Gespeichert · bitte noch ein Symbol eintragen', 'err', 4500); toastPrefix = ''; render(); return; }

}

/* ---------- Sichern und Wiederherstellen ---------- */
async function backup() {
  const data = { app: 'astilla', version: 1, saved: new Date().toISOString(), log: S.log,
                 settings: Object.assign({}, S.settings, { keys: { twelve: '', alpha: '' }, lastBackup: 0 }) };
  const name = 'astilla-sicherung-' + ds(today()) + '.json';
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Astilla Sicherung' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    S.settings.lastBackup = Date.now(); save(); render(); toast('Sicherung erstellt', 'ok');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    toast('Sichern nicht möglich', 'err');
  }
}
function restoreFrom(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast('Datei nicht lesbar', 'err'); return; }
  if (!d || d.app !== 'astilla' || !Array.isArray(d.log)) { toast('Das ist keine Astilla-Sicherung', 'err'); return; }
  const log = d.log.filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.price > 0 && e.amount > 0).map((e, i) => ({
    id: Number(e.id) || Date.now() + i, date: e.date, window: String(e.window || 'manual-' + i), price: +e.price, amount: +e.amount,
    shares: e.shares > 0 ? +e.shares : e.amount / e.price, firstPrice: e.firstPrice > 0 ? +e.firstPrice : +e.price }));
  if (!confirm(log.length + ' Käufe aus der Sicherung laden? Deine jetzigen Käufe werden ersetzt.')) return;
  const keys = S.settings.keys;
  if (d.settings && typeof d.settings === 'object') {
    const s = d.settings;
    ['budget', 'tolUp', 'tolDown', 'pullback'].forEach(k => { if (isFinite(s[k])) S.settings[k] = +s[k]; });
    if (s.sym && typeof s.sym === 'object') ['yahoo', 'twelve', 'alpha'].forEach(k => { if (typeof s.sym[k] === 'string') S.settings.sym[k] = s.sym[k]; });
    if (typeof s.name === 'string') S.settings.name = s.name;
    if (['auto', 'repo', 'yahoo', 'twelve', 'alpha'].includes(s.provider)) S.settings.provider = s.provider;
  }
  S.settings.keys = keys;
  S.log = log;
  save(); render(); toast(log.length + ' Käufe wiederhergestellt', 'ok');
}

/* ---------- Mein Einstieg ---------- */
function position() {
  if (!S.log.length) return null;
  const inv = S.log.reduce((s, e) => s + e.amount, 0), sh = S.log.reduce((s, e) => s + e.shares, 0);
  if (!(sh > 0)) return null;
  const last = S.cache.daily.length ? S.cache.daily[S.cache.daily.length - 1].c : null;
  const value = last == null ? null : last * sh;
  return { inv, sh, avg: inv / sh, value, pl: value == null ? null : value - inv, plPct: value == null ? null : (value / inv - 1) * 100 };
}
const signed = (v, d = 2) => (v >= 0 ? '+' : '−') + num(Math.abs(v), d);

/* ---------- Grafik ---------- */
function chart(a) {
  const D = S.cache.daily, W = S.cache.weekly;
  const off = Math.max(0, D.length - range), d = D.slice(off);
  if (d.length < 2) return '';
  const s20 = [], wl = [];
  let wi = -1;
  d.forEach((x, k) => {
    s20.push(sma(D, 20, off + k));
    const dd = parseD(x.d);
    while (wi + 1 < W.length && parseD(W[wi + 1].d) <= dd) wi++;
    wl.push(wi >= 0 ? a.w30[wi] : null);
  });
  const base = [...d.map(x => x.c), ...s20].filter(v => v != null);
  const pos = position();
  if (pos) base.push(pos.avg);
  let mn = Math.min(...base), mx = Math.max(...base);
  const padv = (mx - mn) * 0.08 || 1;
  mn -= padv; mx += padv;
  const sp = mx - mn;
  const Wd = 360, H = 262, x0 = 6, x1 = 312, y0 = 10, y1 = 236;
  const X = k => x0 + k / (d.length - 1) * (x1 - x0);
  const Y = v => y1 - (v - mn) / sp * (y1 - y0);
  const dec = sp < 5 ? 2 : sp < 30 ? 1 : 0;
  const line = arr => {
    let p = '', pen = false;
    arr.forEach((v, k) => {
      if (v == null) { pen = false; return; }
      p += (pen ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      pen = true;
    });
    return p;
  };
  const closes = d.map(x => x.c);
  const pricePath = line(closes);
  const area = pricePath + 'L' + X(d.length - 1).toFixed(1) + ' ' + y1 + ' L' + X(0).toFixed(1) + ' ' + y1 + ' Z';
  let grid = '';
  for (let i = 0; i < 4; i++) {
    const v = mn + sp * i / 3, y = Y(v).toFixed(1);
    grid += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" stroke-opacity=".14" stroke-width=".6"/>' +
      '<text x="' + (x1 + 6) + '" y="' + (Number(y) + 3.5) + '">' + num(v, dec) + '</text>';
  }
  const mid = Math.floor((d.length - 1) / 2);
  const xl = [[0, 'start'], [mid, 'middle'], [d.length - 1, 'end']].map(p => {
    const tx = p[1] === 'start' ? x0 : p[1] === 'end' ? x1 : X(p[0]);
    return '<text x="' + tx.toFixed(1) + '" y="' + (y1 + 18) + '" text-anchor="' + p[1] + '">' + dt(parseD(d[p[0]].d)) + '</text>';
  }).join('');
  let entrySvg = '';
  if (pos) {
    const ey = Y(pos.avg);
    entrySvg += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + ey.toFixed(1) + '" y2="' + ey.toFixed(1) + '" stroke="#30d158" stroke-width="1.8"/>' +
      '<rect x="' + (x1 + 2) + '" y="' + (ey - 8).toFixed(1) + '" width="52" height="16" rx="8" fill="#30d158"/>' +
      '<text x="' + (x1 + 28) + '" y="' + (ey + 3.6).toFixed(1) + '" text-anchor="middle" style="fill:#fff;font-weight:700">' + num(pos.avg, dec) + '</text>';
    S.log.forEach(e => {
      const idx = d.findIndex(x => x.d >= e.date);
      if (idx < 0 || e.date < d[0].d) return;
      const cy = Math.max(y0, Math.min(y1, Y(e.price)));
      entrySvg += '<circle cx="' + X(idx).toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5.5" fill="#30d158" stroke="var(--solid)" stroke-width="2.2"/>';
    });
  }
  const lastX = X(d.length - 1).toFixed(1), lastY = Y(closes[closes.length - 1]).toFixed(1);
  return '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Kursverlauf" style="color:var(--label)">' +
    '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".38"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient>' +
    '<clipPath id="cp"><rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '"/></clipPath></defs>' +
    grid +
    '<g clip-path="url(#cp)">' +
    '<path d="' + area + '" fill="url(#ga)"/>' +
    '<path d="' + line(wl) + '" fill="none" stroke="#ff453a" stroke-width="3.2" stroke-dasharray="0.1 7" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="' + line(s20) + '" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path d="' + pricePath + '" fill="none" stroke="#0a84ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
    '</g>' + entrySvg +
    '<circle cx="' + lastX + '" cy="' + lastY + '" r="5" fill="#0a84ff" stroke="var(--solid)" stroke-width="2.2"/>' +
    xl + '</svg>';
}

function chartCard(a) {
  const D = S.cache.daily;
  const wInRange = (() => {
    const off = Math.max(0, D.length - range);
    const vals = D.slice(off).map(x => x.c);
    const mn = Math.min(...vals), mx = Math.max(...vals), p = (mx - mn) * 0.2;
    return a.w30now >= mn - p && a.w30now <= mx + p;
  })();
  const seg = [[30, '1 Monat'], [60, '3 Monate'], [100, 'Alles']]
    .map(r => '<button class="' + (range === r[0] ? 'on' : '') + '" data-a="range" data-n="' + r[0] + '">' + r[1] + '</button>').join('');
  const L = D.length - 1, prev = D[L - 1] ? D[L - 1].c : a.close, chg = (a.close / prev - 1) * 100;
  const s = status(a), pos = position();
  const pill = '<button class="pill' + (infoOpen ? ' open' : '') + '" style="--c:var(--' + ({ green: 'green', orange: 'orange', red: 'red', blue: 'blue', gray: 'gray' }[s.color]) + ')" data-a="info" aria-expanded="' + infoOpen + '"><i></i><span>' + esc(s.short) + '</span><em>›</em></button>';
  const head = '<div class="pricehead"><div><div class="big">' + num(a.close) + (S.cache.currency ? '<small>' + esc(S.cache.currency) + '</small>' : '') + '</div>' +
    '<div class="chg ' + (chg >= 0 ? 'up' : 'down') + '">' + (chg >= 0 ? '▲ ' : '▼ ') + num(Math.abs(chg)) + ' % <span>zum Vortag</span></div>' +
    '<div class="asof">' + (D[L].d === ds(today()) ? 'Kurs von heute' : 'Schlusskurs vom ' + parseD(D[L].d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })) + '</div></div>' + pill + '</div>';
  const panel = infoOpen ? '<div class="infopanel"><b>' + esc(s.title) + '</b><p>' + esc(s.text) + '</p>' + checkRows(a) +
    '<div class="note">Alle drei Punkte müssen erfüllt sein, damit der Status auf „Kaufen“ springt.<br>' +
    '<span style="color:#ff9f0a">●</span> 20-Tage-Linie: Durchschnitt der letzten 20 Handelstage.<br>' +
    '<span style="color:#ff453a">●</span> 30-Wochen-Linie (gepunktet): langfristiger Trend' + (wInRange ? '' : ', liegt außerhalb des Ausschnitts') + '.' +
    (pos ? '<br><span style="color:#30d158">●</span> Einstieg: dein durchschnittlicher Kaufkurs (grüne Linie). Die Punkte sind deine einzelnen Käufe.' : '') + '</div></div>' : '';
  const legend = '<div class="legend"><span><i class="dot" style="margin:0;background:#ff9f0a;color:#ff9f0a"></i>20 Tage <b>' + num(a.s20) + '</b></span>' +
    '<span><i class="dot" style="margin:0;background:#ff453a;color:#ff453a"></i>30 Wochen <b>' + num(a.w30now) + '</b></span>' +
    (pos ? '<span><i class="dot" style="margin:0;background:#30d158;color:#30d158"></i>Einstieg <b>' + num(pos.avg) + '</b> <b style="color:var(--' + (pos.plPct >= 0 ? 'green' : 'red') + ')">' + signed(pos.plPct, 1) + ' %</b></span>' : '') + '</div>';
  return '<div class="sec">Kursverlauf</div>' +
    '<div class="group">' + head + panel + '<div class="seg">' + seg + '</div>' +
    '<div class="chartbox">' + chart(a) + '</div>' + legend + '</div>';
}

function banner() {
  return msg ? '<div class="' + (msgType === 'err' ? 'alert' : 'ok-msg') + '">' + esc(msg) + '</div>' : '';
}
function title(t) {
  const st = S.settings, c = S.cache;
  const when = c.at ? stamp(c.at) : c.fetched ? parseD(c.fetched).toLocaleDateString('de-DE') : '';
  return '<h1>' + esc(t) + '</h1><div class="sub">' + esc(st.name || st.sym.yahoo || st.sym.alpha || st.sym.twelve || 'Noch kein ETF gewählt') + (when ? ' · Stand ' + when : '') + (staleData() ? ' <span style="color:var(--orange);font-weight:600">· Daten alt</span>' : '') + '</div>';
}

function checkRows(a) {
  const st = S.settings;
  const rows = [
    [a.trendUp, 'Trend steigt', 'Die 30-Wochen-Linie zeigt nach oben.'],
    [a.pulled, 'Rücksetzer', 'Mind. ' + num(st.pullback, 1) + ' % unter dem 10-Tage-Hoch (jetzt ' + num(a.pull, 1) + ' %).'],
    [a.near, 'Nahe an der 20-Tage-Linie', 'Abstand ' + num(a.dist, 1) + ' % (erlaubt: −' + num(st.tolDown, 1) + ' % bis +' + num(st.tolUp, 1) + ' %).']
  ];
  return rows.map(r => '<div class="crow"><i class="chk ' + (r[0] ? 'ok' : 'no') + '">' + (r[0] ? '✓' : '–') + '</i><span>' + r[1] + '<small>' + r[2] + '</small></span></div>').join('');
}

function limitCard() {
  const c = S.cache, st = S.settings, n = usedToday(), pct = Math.min(100, n / FREE_LIMIT * 100);
  const src = c.source ? PROV[c.source].name + (c.via ? ' (über ' + c.via + ')' : '') : '–';
  let rows =
    '<div class="row"><span class="k">Aktuelle Quelle</span><span class="v strong">' + esc(src) + '</span></div>' +
    '<div class="row"><span class="k">Zuletzt aktualisiert</span><span class="v strong">' + (c.at ? stamp(c.at) : '–') + '</span></div>' +
    '<div class="row"><span class="k">Modus</span><span class="v strong">' + (st.provider === 'auto' ? 'Automatisch' : esc(PROV[st.provider].name)) + '</span></div>';
  if (st.keys.alpha) {
    rows += '<div class="row"><span class="k">Alpha Vantage heute<small>Zähler nur für dieses Gerät</small></span><span class="v strong">' + n + ' von ' + FREE_LIMIT + '</span></div>' +
      '<div class="row" style="display:block;padding-top:0;min-height:0;padding-bottom:14px"><div class="bar' + (n >= FREE_LIMIT ? ' full' : '') + '"><i style="width:' + pct + '%"></i></div></div>';
  }
  ORDER.forEach(p => {
    if (c.limits && c.limits[p] === ds(today()))
      rows += '<div class="row"><span class="k">' + PROV[p].name + '</span><span class="v strong" style="color:var(--red)">Limit erreicht</span></div>';
  });
  return '<div class="sec">Datenquelle und Limit</div><div class="group">' + rows + '</div>' +
    '<div class="foot"><b>Kursdatei (GitHub)</b> ist der zuverlässigste Weg: Eine Automatik im Repo holt die Kurse werktags etwa alle 30 Minuten bei Yahoo und legt sie neben die App. Kein Schlüssel, kein Proxy, kein Limit. Sie nutzt das Yahoo-Symbol aus den Einstellungen, das auch in <code>symbols.json</code> im Repo stehen muss.<br><br><b>Yahoo Finance</b> direkt braucht keinen Schlüssel und hat kein festes Tageslimit. Die Schnittstelle ist inoffiziell, Kurse können leicht verzögert sein. ' +
    'Solange die App offen ist, wird alle 15 Minuten aktualisiert. Blockiert der Browser die Direktabfrage, läuft sie über einen öffentlichen Proxy, dabei wird nur das ETF-Symbol übertragen.<br><br>' +
    '<b>Alpha Vantage</b> (gratis): etwa 25 Anfragen pro Tag und 5 pro Minute. Eine Aktualisierung braucht 2 Anfragen, eine Suche 1. Nach einem Limit-Fehler fragt die App am selben Tag nicht mehr von selbst an. ' +
    '<b>Twelve Data</b> (gratis): 8 pro Minute und 800 pro Tag, aber nicht jede Börse.<br><br>' +
    'Im Modus „Automatisch“ nimmt die App die Quellen der Reihe nach (Kursdatei, Yahoo, Twelve Data, Alpha Vantage) und nutzt die erste, die Daten liefert.</div>';
}

function todayView() {
  const st = S.settings, a = analyze(), s = status(a), t = today(), win = windowOf(t);
  const days = Math.round((win.end - t) / DAY);
  const bought = S.log.find(e => e.window === win.key);
  const half = st.budget / 2;
  const mSum = monthTotal(), done = budgetReached(), remaining = Math.max(0, st.budget - mSum), suggest = Math.min(half, remaining) || half;
  const winText = win.start.getDate() + '.–' + win.end.getDate() + '. ' + monShort(win.end);
  let h = title('Heute') + banner();
  if (!a) h += '<div class="hero"><div class="badge ' + s.color + '">' + s.icon + '</div><b>' + esc(s.title) + '</b><span>' + esc(s.text) + '</span></div>';
  if (S.cache.error) {
    const lim = /limit|zu viele anfragen/i.test(S.cache.error);
    const sum = (lim ? 'Limit erreicht' : 'Kurse konnten nicht geladen werden') + (S.cache.daily.length ? ', letzter Stand wird angezeigt' : '') + '.';
    h += '<div class="alert errc" data-a="err"><b>' + (lim ? 'Limit erreicht' : 'Abruf fehlgeschlagen') + '<em>' + (errOpen ? '▾' : 'Details ›') + '</em></b>' +
      (errOpen ? esc(S.cache.error).replace(/\n/g, '<br>') + (S.settings.provider !== 'auto' ? '<small>Tipp: Stelle die Datenquelle in den Einstellungen auf „Auto“. Dann probiert die App die nächste Quelle, wenn diese ausfällt.</small>' : '') + (S.cache.detail ? '<small>Meldung des Anbieters: ' + esc(S.cache.detail) + '</small>' : '') : esc(sum)) + '</div>';
  }
  if (a) h += chartCard(a);
  h += '<div class="sec">Aktuelles Fenster</div><div class="group">' +
    '<div class="row"><span class="k">Zeitraum</span><span class="v strong">' + winText + '</span></div>' +
    '<div class="row"><span class="k">Noch</span><span class="v strong">' + (days > 0 ? days + (days === 1 ? ' Tag' : ' Tage') : 'Heute letzter Tag') + '</span></div>' +
    (done ? '' : '<div class="row"><span class="k">Betrag<small>' + (suggest < half ? 'Rest bis zum Monatsbudget' : 'Hälfte des Monatsbudgets') + '</small></span><span class="v strong">' + num(suggest, 0) + ' €</span></div>') +
    '<div class="row"><span class="k">Diesen Monat gekauft</span><span class="v strong" style="color:var(--' + (done ? 'green' : 'label') + ')">' + num(mSum, 0) + ' von ' + num(st.budget, 0) + ' €</span></div>' +
    '<div class="row" style="display:block;padding-top:0;min-height:0;padding-bottom:14px"><div class="bar' + (done ? '' : '') + '"><i style="width:' + Math.min(100, st.budget ? mSum / st.budget * 100 : 0) + '%"></i></div></div></div>';
  const buyForm = (title, amount, foot) => '<div class="sec">' + title + '</div><div class="group">' +
    '<div class="field"><label for="bp">Kurs</label><input id="bp" inputmode="decimal" value="' + a.close.toFixed(2) + '"></div>' +
    '<div class="field"><label for="ba">Betrag in €</label><input id="ba" inputmode="decimal" value="' + amount + '"></div></div>' +
    '<button class="btn" data-a="buy">Kauf speichern</button><div class="foot">' + foot + '</div>';
  if (done) {
    if (a && a.green && !staleData()) h += buyForm('Zusätzlicher Kauf (freiwillig)', half, 'Dein Monatsbudget ist erreicht. Das Signal empfiehlt trotzdem einen Kauf. Du entscheidest.');
  } else if (bought) {
    h += '<div class="sec">Kauf</div><div class="group"><div class="row"><span class="k">Gekauft am ' + esc(bought.date) + '</span><span class="v strong">' + num(bought.price) + '</span></div></div>';
  } else if (a) {
    h += buyForm('Kauf erfassen', suggest, 'Der Kurs ist der zuletzt geladene Kurs. Passe ihn an, wenn du anders gekauft hast.');
  }
  h += limitCard();
  h += '<button class="btn sec2" data-a="refresh">' + (busy ? 'Lädt …' : 'Kurse aktualisieren') + '</button>';
  return h;
}

function addEntry() {
  const g = id => (document.getElementById(id) || { value: '' }).value.replace(',', '.');
  const date = g('ed'), price = parseFloat(g('ep')), amt = parseFloat(g('ea'));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !(price > 0) || !(amt > 0)) { toast('Bitte Datum, Kurs und Betrag prüfen', 'err'); return; }
  const id = Date.now();
  S.log.push({ id, date, window: 'manual-' + id, price, amount: amt, shares: amt / price, firstPrice: price });
  save(); render(); toast('Einstieg gespeichert', 'ok');
}

  if (!S.settings.lastBackup) h += '<div class="foot">Tipp: Sichere deine Käufe unter Einstellungen → Daten sichern. Sie liegen nur in diesem Browser.</div>';
  return h + entryForm();

    '<div class="field"><label for="bud">Budget pro Monat (€)</label><input id="bud" inputmode="decimal" value="' + st.budget + '"></div>' +
    '<div class="field"><label for="tu">Toleranz über 20er-Linie (%)</label><input id="tu" inputmode="decimal" value="' + st.tolUp + '"></div>' +
    '<div class="field"><label for="td">Toleranz unter 20er-Linie (%)</label><input id="td" inputmode="decimal" value="' + st.tolDown + '"></div>' +
    '<div class="field"><label for="pb">Mind. Rücksetzer (%)</label><input id="pb" inputmode="decimal" value="' + st.pullback + '"></div></div>' +
    '<button class="btn" data-a="save">Speichern</button>';
}

function tabbar() {
  const ic = {
    heute: '<svg viewBox="0 0 24 24"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>',
    verlauf: '<svg viewBox="0 0 24 24"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4.5" cy="7" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="17" r=".6"/></svg>',
    einstellungen: '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--knob)"/><circle cx="15" cy="17" r="2.4" fill="var(--knob)"/></svg>'
  };
  const t = [['heute', 'Heute'], ['verlauf', 'Verlauf'], ['einstellungen', 'Einstellungen']];
  return '<nav class="tabbar">' + t.map(x => '<button class="' + (view === x[0] ? 'on' : '') + '" data-a="tab" data-v="' + x[0] + '">' + ic[x[0]] + x[1] + '</button>').join('') + '</nav>';
}

function render() {
  const keep = document.activeElement && document.activeElement.id;
  const body = view === 'einstellungen' ? settingsView() : view === 'verlauf' ? logView() : todayView();
  document.getElementById('app').innerHTML = body + tabbar();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a;
  if (!['search', 'refresh', 'range', 'theme', 'prov'].includes(a)) msg = '';
  if (a === 'tab') { view = t.dataset.v; window.scrollTo(0, 0); render(); }
  else if (a === 'addentry') { addEntry(); }
  else if (a === 'backup') { await backup(); }
  else if (a === 'restore') { const f = document.getElementById('restoreFile'); if (f) f.click(); }
  else if (a === 'err') { errOpen = !errOpen; render(); }
  else if (a === 'info') { infoOpen = !infoOpen; render(); }
  else if (a === 'range') { range = Number(t.dataset.n); render(); }
  else if (a === 'theme') { S.settings.theme = t.dataset.v; save(); applyTheme(); render(); }
  else if (a === 'prov') { S.settings.provider = t.dataset.v; save(); render(); }
  else if (a === 'refresh') { await refresh(true); }
  else if (a === 'buy') { buy(); }
  else if (a === 'del') {
    if (confirm('Eintrag löschen?')) { S.log = S.log.filter(x => String(x.id) !== t.dataset.id); save(); render(); }
  }
  else if (a === 'search') {
    const src = t.dataset.src, el = document.getElementById(src === 'yahoo' ? 'qy' : 'qa');
    await search(src, el ? el.value : '');
  }
  else if (a === 'pick') {
    S.settings.sym[t.dataset.src] = t.dataset.s; S.settings.name = t.dataset.n; results = [];
    msg = ''; save(); view = 'heute'; toastPrefix = 'ETF gewählt · '; await refresh(true);
  }
  else if (a === 'save') { saveSettings(); }
});

document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'restoreFile' || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0], r = new FileReader();
  r.onload = () => restoreFrom(String(r.result));
  r.onerror = () => toast('Datei nicht lesbar', 'err');
  r.readAsText(f);
  e.target.value = '';
});

/* Live-Aktualisierung: alle 5 Minuten prüfen, geladen wird nur, wenn die Daten älter als 15 Minuten sind */
setInterval(() => { if (!document.hidden && view === 'heute' && !busy) refresh(false); }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); if (!document.hidden && view === 'heute' && !busy) refresh(false); });

/* Neue App-Version erkennen (iOS speichert Web-Apps stark zwischen) und einmal neu laden */
async function checkUpdate() {
  try {
    const r = await fetch('index.html?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION\s*=\s*'(\d+)'/);
    if (!m || m[1] === APP_VERSION) return;
    let tried = ''; try { tried = sessionStorage.getItem('astilla.upd') || ''; } catch (e) {}
    if (tried === m[1]) return;
    try { sessionStorage.setItem('astilla.upd', m[1]); } catch (e) {}
    toast('Neue Version, lade neu …', 'busy');
    setTimeout(() => location.replace(location.pathname + '?v=' + m[1]), 700);
  } catch (e) {}
}

/* Runterziehen: Seite neu laden und die Kurse frisch holen */
(function () {
  const el = document.createElement('div');
  el.className = 'ptr'; el.innerHTML = '<i></i><span>Ziehen zum Aktualisieren</span>';
  document.body.appendChild(el);
  const label = el.querySelector('span');
  let y0 = null, dy = 0;
  const TH = 90;
  const reset = () => { el.style.transition = 'transform .25s, opacity .25s'; el.style.transform = 'translate(-50%,-80px)'; el.style.opacity = '0'; el.classList.remove('ready'); y0 = null; dy = 0; };
  document.addEventListener('touchstart', e => {
    const t = e.target;
    y0 = (window.scrollY <= 0 && e.touches.length === 1 && !(t.closest && t.closest('input,textarea'))) ? e.touches[0].clientY : null;
    dy = 0; el.style.transition = 'none';
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0) { if (dy <= 0) { y0 = null; } return; }
    if (e.cancelable) e.preventDefault();
    const pull = Math.min(dy * 0.55, 80);
    el.style.transform = 'translate(-50%,' + (pull - 70) + 'px)';
    el.style.opacity = String(Math.min(1, dy / 50));
    const ready = dy > TH;
    el.classList.toggle('ready', ready);
    label.textContent = ready ? 'Loslassen zum Aktualisieren' : 'Ziehen zum Aktualisieren';
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (y0 === null) { return; }
    if (dy > TH) {
      el.classList.remove('ready'); el.classList.add('spin'); label.textContent = 'Lade neu …';
      el.style.transition = 'transform .25s'; el.style.transform = 'translate(-50%,10px)'; el.style.opacity = '1';
      try { S.cache.checkedAt = 0; save(); } catch (e) {}
      setTimeout(() => location.reload(), 350);
    } else reset();
  }, { passive: true });
  document.addEventListener('touchcancel', reset, { passive: true });
})();

applyTheme();
if (!order().length) view = 'einstellungen';
render();
refresh(false);
checkUpdate();
</script>
</body>
