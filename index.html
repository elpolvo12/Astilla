<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Astilla">
<meta name="theme-color" content="#0b0d14">
<title>Astilla</title>
<style>
/* ---------- Farben ---------- */
:root{
  color-scheme:light;
  --label:#0b0d14;--label2:rgba(20,24,40,.62);--label3:rgba(20,24,40,.32);
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.72);--glass-edge:rgba(255,255,255,.75);
  --glass-shadow:0 10px 34px rgba(60,72,140,.16);--glass-hi:rgba(255,255,255,.9);
  --sep:rgba(20,24,40,.10);--fill:rgba(120,120,140,.16);--solid:#ffffff;--knob:#ffffff;
  --blue:#007aff;--green:#30c25a;--orange:#ff9500;--red:#ff3b30;--gray:#8e8e93;
  --bg0:#eaf0ff;
  --blob1:rgba(0,122,255,.38);--blob2:rgba(175,82,222,.30);--blob3:rgba(52,199,189,.34);--blob4:rgba(255,149,0,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --label:#ffffff;--label2:rgba(235,238,255,.66);--label3:rgba(235,238,255,.34);
    --glass:rgba(38,42,60,.46);--glass-strong:rgba(50,55,78,.62);--glass-edge:rgba(255,255,255,.16);
    --glass-shadow:0 12px 38px rgba(0,0,0,.45);--glass-hi:rgba(255,255,255,.22);
    --sep:rgba(255,255,255,.10);--fill:rgba(160,165,200,.20);--solid:#2a2d3e;--knob:#3a3d52;
    --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
    --bg0:#07080e;
    --blob1:rgba(10,132,255,.42);--blob2:rgba(140,70,230,.38);--blob3:rgba(20,170,160,.26);--blob4:rgba(255,120,60,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --label:#ffffff;--label2:rgba(235,238,255,.66);--label3:rgba(235,238,255,.34);
  --glass:rgba(38,42,60,.46);--glass-strong:rgba(50,55,78,.62);--glass-edge:rgba(255,255,255,.16);
  --glass-shadow:0 12px 38px rgba(0,0,0,.45);--glass-hi:rgba(255,255,255,.22);
  --sep:rgba(255,255,255,.10);--fill:rgba(160,165,200,.20);--solid:#2a2d3e;--knob:#3a3d52;
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --bg0:#07080e;
  --blob1:rgba(10,132,255,.42);--blob2:rgba(140,70,230,.38);--blob3:rgba(20,170,160,.26);--blob4:rgba(255,120,60,.16);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg0)}
body{margin:0;color:var(--label);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 112px)}
/* Hintergrund mit farbigen Lichtflecken, damit das Glas etwas zum Brechen hat */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 40% at 12% 8%,var(--blob1),transparent 70%),
  radial-gradient(55% 38% at 95% 22%,var(--blob2),transparent 70%),
  radial-gradient(60% 40% at 8% 62%,var(--blob3),transparent 70%),
  radial-gradient(55% 38% at 92% 92%,var(--blob4),transparent 70%),
  var(--bg0)}
#app{max-width:560px;margin:0 auto}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;margin:18px 0 2px}
.sub{color:var(--label2);font-size:15px;margin-bottom:8px}
.sec{font-size:13px;text-transform:uppercase;color:var(--label2);margin:24px 18px 8px;letter-spacing:.3px;font-weight:500}
.foot{font-size:13px;color:var(--label2);margin:8px 18px 0;line-height:1.4}

/* ---------- Liquid Glass ---------- */
.glass,.group,.hero,.tabbar,.seg,.alert,.ok-msg{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.06);
}
.group,.hero{border-radius:26px;position:relative;overflow:hidden}
/* Lichtreflex oben links */
.group::after,.hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 38%)}
.row,.field{position:relative;z-index:1}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:11px 18px}
.row+.row::before,.row+.field::before,.field+.field::before,.field+.row::before,.seg+.chartbox+.row::before{content:"";position:absolute;top:0;left:18px;right:0;height:.5px;background:var(--sep)}
.row .k{flex:1 1 auto;min-width:0}
.row .v{flex:0 1 auto;min-width:0;color:var(--label2);text-align:right}
.row .v.strong{color:var(--label);font-weight:600}
.row small{display:block;color:var(--label2);font-size:13px;margin-top:1px;line-height:1.3}
.row .l{display:flex;align-items:center;flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:12px;flex:none;box-shadow:0 0 8px currentColor}

.hero{padding:26px 20px 24px;text-align:center;margin-top:12px}
.hero>*{position:relative;z-index:1}
.badge{--c:var(--gray);width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:700;line-height:1;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.7),rgba(255,255,255,0) 46%),var(--c);
  box-shadow:0 10px 30px color-mix(in srgb,var(--c) 55%,transparent),inset 0 2px 3px rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.14)}
.badge.green{--c:var(--green)}.badge.orange{--c:var(--orange)}.badge.red{--c:var(--red)}.badge.gray{--c:var(--gray)}.badge.blue{--c:var(--blue)}
.hero b{display:block;font-size:27px;font-weight:700;letter-spacing:.2px}
.hero span{display:block;color:var(--label2);font-size:15px;margin-top:6px}

.chk{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex:none;margin-right:12px}
.chk.ok{background:var(--green);box-shadow:0 2px 10px color-mix(in srgb,var(--green) 55%,transparent),inset 0 1px 1px rgba(255,255,255,.5)}
.chk.no{background:var(--fill);color:var(--label2)}

.seg{display:flex;border-radius:999px;padding:3px;margin:14px 16px 4px;position:relative;z-index:1}
.seg button{flex:1;border:0;background:transparent;color:var(--label);font:inherit;font-size:13px;font-weight:500;padding:7px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-hi);font-weight:600}
.chartbox{padding:8px 6px 0;position:relative;z-index:1}
svg{width:100%;height:auto;display:block}
svg text{font:10px -apple-system,system-ui,sans-serif;fill:var(--label2)}

button.btn{display:block;width:100%;border:0;border-radius:999px;color:#fff;font:inherit;font-weight:600;padding:15px 16px;margin-top:16px;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 80%,#fff),var(--blue));
  box-shadow:0 8px 24px color-mix(in srgb,var(--blue) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.55)}
button.btn:active{transform:scale(.98);opacity:.85}
button.btn.sec2{color:var(--blue);background:var(--glass);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
button.link{border:0;background:none;color:var(--blue);font:inherit;padding:4px 0 4px 10px;cursor:pointer}
button.link.del{color:var(--red)}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:6px 18px}
.field label{flex:none;max-width:58%}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--label);font:inherit;text-align:right;padding:8px 0;outline:none}
.field input::placeholder{color:var(--label3)}

.alert,.ok-msg{border-radius:20px;padding:13px 16px;font-size:14px;margin:14px 0 0;line-height:1.4}
.alert{color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--glass))}
.alert b{display:block;margin-bottom:3px}
.alert small{display:block;opacity:.8;margin-top:6px;font-size:12px}
.ok-msg{color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--glass))}
.empty{text-align:center;color:var(--label2);padding:40px 16px}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green))}
.bar.full i{background:var(--red)}

/* ---------- schwebende Tab-Leiste ---------- */
.tabbar{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom) + 10px);
  border-radius:999px;display:flex;gap:2px;padding:6px;z-index:10}
.tabbar button{flex:1;border:0;background:none;color:var(--label2);font:inherit;font-size:10px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;cursor:pointer}
.tabbar button.on{color:var(--blue);background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 10px rgba(0,0,0,.14)}
.tabbar svg{width:24px;height:24px;margin:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY = 'astilla.v1', DAY = 86400000, FREE_LIMIT = 25;
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d = 2) => Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const dt = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
const dtl = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
const monShort = d => d.toLocaleDateString('de-DE', { month: 'short' });

function defaults() {
  return {
    settings: { apiKey: '', symbol: '', name: '', budget: 1000, tolUp: 1, tolDown: 3, pullback: 1, theme: 'dark' },
    cache: { fetched: '', symbol: '', daily: [], weekly: [], error: '', detail: '', limitDate: '' },
    usage: { date: '', n: 0 },
    log: []
  };
}
function load() {
  const b = defaults();
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) {
      b.settings = Object.assign(b.settings, d.settings || {});
      b.cache = Object.assign(b.cache, d.cache || {});
      b.usage = Object.assign(b.usage, d.usage || {});
      b.log = Array.isArray(d.log) ? d.log : [];
    }
  } catch (e) {}
  return b;
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

let S = load();
let view = 'heute', busy = false, msg = '', msgType = 'ok', results = [], range = 60;

function applyTheme() {
  const t = S.settings.theme, el = document.documentElement;
  if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); else el.removeAttribute('data-theme');
}

/* Anfragen-Zähler (nur für dieses Gerät) */
function bump() {
  const t = ds(today());
  if (S.usage.date !== t) S.usage = { date: t, n: 0 };
  S.usage.n++;
  save();
}
const usedToday = () => (S.usage.date === ds(today()) ? S.usage.n : 0);

function windowOf(d) {
  const y = d.getFullYear(), m = d.getMonth(), last = new Date(y, m + 1, 0).getDate(), base = ds(d).slice(0, 7);
  return d.getDate() <= 15
    ? { key: base + '-A', start: new Date(y, m, 1), end: new Date(y, m, 15) }
    : { key: base + '-B', start: new Date(y, m, 16), end: new Date(y, m, last) };
}

function sma(arr, n, i) {
  if (i < n - 1) return null;
  let s = 0;
  for (let k = i - n + 1; k <= i; k++) s += arr[k].c;
  return s / n;
}

function analyze() {
  const { daily, weekly } = S.cache;
  if (daily.length < 50 || weekly.length < 31) return null;
  const L = daily.length - 1, close = daily[L].c;
  const s20 = sma(daily, 20, L), s50 = sma(daily, 50, L);
  const w30 = weekly.map((_, i) => sma(weekly, 30, i));
  const W = weekly.length - 1;
  const w30now = w30[W], w30prev = w30[W - 1];
  const trendUp = w30now > w30prev;
  const dist = (close - s20) / s20 * 100;
  const recentHigh = Math.max(...daily.slice(-10).map(x => x.c));
  const pull = (close / recentHigh - 1) * 100;
  const near = dist <= S.settings.tolUp && dist >= -S.settings.tolDown;
  const pulled = pull <= -S.settings.pullback;
  const green = trendUp && near && pulled;
  return { close, s20, s50, w30, w30now, trendUp, dist, pull, near, pulled, green };
}

function status(a) {
  const t = today(), win = windowOf(t);
  const bought = S.log.find(e => e.window === win.key);
  const lastDay = ds(t) === ds(win.end);
  if (bought) return { color: 'blue', icon: '✓', title: 'Erledigt', text: 'In diesem Zeitfenster hast du schon gekauft.' };
  if (!a) return { color: 'gray', icon: '…', title: 'Keine Daten', text: 'Kursdaten fehlen noch. Prüfe unten den Datenabruf.' };
  if (a.green) return { color: 'green', icon: '✓', title: 'Jetzt kaufen', text: 'Der Trend steigt und der Kurs hat nach einem Rücksetzer die 20-Tage-Linie erreicht.' };
  if (lastDay) return { color: 'orange', icon: '!', title: 'Letzter Tag', text: 'Heute endet das Zeitfenster. Kaufe heute, auch ohne Signal.' };
  if (!a.trendUp) return { color: 'red', icon: '↓', title: 'Trend fällt', text: 'Die 30-Wochen-Linie fällt. Warte, bis das Fenster endet.' };
  return { color: 'orange', icon: '…', title: 'Noch warten', text: 'Der Trend ist gut, aber der Kurs ist noch nicht zurückgekommen.' };
}

/* ---------- Datenabruf ---------- */
function limitError(detail) {
  const e = new Error('limit'); e.limit = true; e.detail = detail || ''; return e;
}
async function av(fn, sym, key, extra) {
  const url = 'https://www.alphavantage.co/query?function=' + fn + '&symbol=' + encodeURIComponent(sym) + (extra || '') + '&apikey=' + encodeURIComponent(key);
  bump();
  const r = await fetch(url);
  if (!r.ok) throw new Error('Verbindungsfehler (HTTP ' + r.status + ')');
  const j = await r.json();
  if (j['Error Message']) throw new Error('Symbol unbekannt. Wähle den ETF in den Einstellungen neu aus.');
  if (j.Note || j.Information) throw limitError(j.Note || j.Information);
  const series = j['Time Series (Daily)'] || j['Weekly Time Series'];
  if (!series) throw new Error('Keine Daten erhalten');
  return Object.keys(series).sort().map(d => ({ d, c: parseFloat(series[d]['4. close']) })).filter(x => isFinite(x.c));
}
function limitText(detail) {
  const m = (detail || '').toLowerCase();
  if (m.includes('per minute') || m.includes('calls per minute') || m.includes('burst'))
    return 'Zu viele Anfragen in kurzer Zeit. Warte eine Minute und aktualisiere dann erneut.';
  return 'Das Tageslimit von Alpha Vantage ist erreicht. Neue Kurse gibt es erst nach dem Zurücksetzen, in der Regel am nächsten Tag.';
}

async function refresh(force) {
  const st = S.settings, c = S.cache;
  if (!st.apiKey || !st.symbol) {
    c.error = 'Bitte Schlüssel und ETF in den Einstellungen eintragen.'; c.detail = '';
    render(); return;
  }
  if (!force && c.fetched === ds(today()) && c.symbol === st.symbol && c.daily.length) { render(); return; }
  /* Nach einem Limit-Fehler am selben Tag nicht automatisch erneut anfragen, das verbraucht nur Anfragen. */
  if (!force && c.limitDate === ds(today()) && c.symbol === st.symbol) { render(); return; }
  busy = true; render();
  try {
    const daily = await av('TIME_SERIES_DAILY', st.symbol, st.apiKey, '&outputsize=compact');
    const weekly = await av('TIME_SERIES_WEEKLY', st.symbol, st.apiKey, '');
    S.cache = { fetched: ds(today()), symbol: st.symbol, daily, weekly, error: '', detail: '', limitDate: '' };
  } catch (err) {
    if (c.symbol !== st.symbol) { c.daily = []; c.weekly = []; c.fetched = ''; }
    const keep = c.daily.length ? ' Angezeigt wird der letzte gespeicherte Stand.' : '';
    if (err.limit) { c.limitDate = ds(today()); c.error = limitText(err.detail) + keep; c.detail = err.detail; }
    else { c.error = err.message + keep; c.detail = ''; }
  }
  busy = false; save(); render();
}

async function search(q) {
  const st = S.settings;
  if (!st.apiKey) { msg = 'Bitte zuerst den Schlüssel eintragen und speichern.'; msgType = 'err'; render(); return; }
  if (!q.trim()) return;
  try {
    bump();
    const r = await fetch('https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords=' + encodeURIComponent(q) + '&apikey=' + encodeURIComponent(st.apiKey));
    const j = await r.json();
    if (j.Note || j.Information) throw limitError(j.Note || j.Information);
    results = (j.bestMatches || []).slice(0, 8).map(m => ({ symbol: m['1. symbol'], name: m['2. name'], region: m['4. region'], currency: m['8. currency'] }));
    if (!results.length) { msg = 'Keine Treffer.'; msgType = 'err'; }
  } catch (err) { msg = err.limit ? limitText(err.detail) : 'Suche fehlgeschlagen: ' + err.message; msgType = 'err'; }
  render();
}

function buy() {
  const p = parseFloat(document.getElementById('bp').value.replace(',', '.'));
  const amt = parseFloat(document.getElementById('ba').value.replace(',', '.'));
  if (!(p > 0) || !(amt > 0)) { msg = 'Bitte Kurs und Betrag prüfen.'; msgType = 'err'; render(); return; }
  const t = today(), win = windowOf(t);
  if (S.log.some(e => e.window === win.key)) { msg = 'Für dieses Fenster gibt es schon einen Kauf.'; msgType = 'err'; render(); return; }
  const first = S.cache.daily.find(x => { const d = parseD(x.d); return d >= win.start && d <= win.end; });
  S.log.push({ id: Date.now(), date: ds(t), window: win.key, price: p, amount: amt, shares: amt / p, firstPrice: first ? first.c : p });
  save(); msg = 'Kauf gespeichert.'; msgType = 'ok'; render();
}

function saveSettings() {
  const g = id => document.getElementById(id).value.replace(',', '.');
  const st = S.settings;
  st.apiKey = g('key').trim();
  st.budget = parseFloat(g('bud')) || 1000;
  st.tolUp = parseFloat(g('tu')) || 0;
  st.tolDown = parseFloat(g('td')) || 0;
  st.pullback = parseFloat(g('pb')) || 0;
  view = 'heute'; msg = 'Gespeichert.'; msgType = 'ok'; save(); refresh(true);
}

/* ---------- Grafik ---------- */
function chart(a) {
  const D = S.cache.daily, W = S.cache.weekly;
  const off = Math.max(0, D.length - range), d = D.slice(off);
  if (d.length < 2) return '';
  const s20 = [], wl = [];
  let wi = -1;
  d.forEach((x, k) => {
    s20.push(sma(D, 20, off + k));
    const dd = parseD(x.d);
    while (wi + 1 < W.length && parseD(W[wi + 1].d) <= dd) wi++;
    wl.push(wi >= 0 ? a.w30[wi] : null);
  });
  const base = [...d.map(x => x.c), ...s20].filter(v => v != null);
  let mn = Math.min(...base), mx = Math.max(...base);
  const padv = (mx - mn) * 0.08 || 1;
  mn -= padv; mx += padv;
  const sp = mx - mn;
  const Wd = 360, H = 210, x0 = 6, x1 = 312, y0 = 10, y1 = 184;
  const X = k => x0 + k / (d.length - 1) * (x1 - x0);
  const Y = v => y1 - (v - mn) / sp * (y1 - y0);
  const dec = sp < 5 ? 2 : sp < 30 ? 1 : 0;

  const line = arr => {
    let p = '', pen = false;
    arr.forEach((v, k) => {
      if (v == null) { pen = false; return; }
      p += (pen ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      pen = true;
    });
    return p;
  };
  const closes = d.map(x => x.c);
  const pricePath = line(closes);
  const area = pricePath + 'L' + X(d.length - 1).toFixed(1) + ' ' + y1 + ' L' + X(0).toFixed(1) + ' ' + y1 + ' Z';

  let grid = '';
  for (let i = 0; i < 4; i++) {
    const v = mn + sp * i / 3, y = Y(v).toFixed(1);
    grid += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" stroke-opacity=".14" stroke-width=".6"/>' +
      '<text x="' + (x1 + 6) + '" y="' + (Number(y) + 3.5) + '">' + num(v, dec) + '</text>';
  }
  const mid = Math.floor((d.length - 1) / 2);
  const xl = [[0, 'start'], [mid, 'middle'], [d.length - 1, 'end']].map(p => {
    const tx = p[1] === 'start' ? x0 : p[1] === 'end' ? x1 : X(p[0]);
    return '<text x="' + tx.toFixed(1) + '" y="' + (y1 + 18) + '" text-anchor="' + p[1] + '">' + dt(parseD(d[p[0]].d)) + '</text>';
  }).join('');

  const lastX = X(d.length - 1).toFixed(1), lastY = Y(closes[closes.length - 1]).toFixed(1);
  return '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Kursverlauf" style="color:var(--label)">' +
    '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".38"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient>' +
    '<clipPath id="cp"><rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '"/></clipPath></defs>' +
    grid +
    '<g clip-path="url(#cp)">' +
    '<path d="' + area + '" fill="url(#ga)"/>' +
    '<path d="' + line(wl) + '" fill="none" stroke="#ff453a" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round"/>' +
    '<path d="' + line(s20) + '" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path d="' + pricePath + '" fill="none" stroke="#0a84ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
    '</g>' +
    '<circle cx="' + lastX + '" cy="' + lastY + '" r="5" fill="#0a84ff" stroke="var(--solid)" stroke-width="2.2"/>' +
    xl + '</svg>';
}

function chartCard(a) {
  const D = S.cache.daily;
  const wInRange = (() => {
    const off = Math.max(0, D.length - range);
    const vals = D.slice(off).map(x => x.c);
    const mn = Math.min(...vals), mx = Math.max(...vals), p = (mx - mn) * 0.2;
    return a.w30now >= mn - p && a.w30now <= mx + p;
  })();
  const seg = [[30, '1 Monat'], [60, '3 Monate'], [100, 'Alles']]
    .map(r => '<button class="' + (range === r[0] ? 'on' : '') + '" data-a="range" data-n="' + r[0] + '">' + r[1] + '</button>').join('');
  return '<div class="sec">Kursverlauf</div>' +
    '<div class="group"><div class="seg">' + seg + '</div>' +
    '<div class="chartbox">' + chart(a) + '</div>' +
    '<div class="row"><span class="l"><i class="dot" style="background:#0a84ff;color:#0a84ff"></i>Kurs</span><span class="v strong">' + num(a.close) + '</span></div>' +
    '<div class="row"><span class="l"><i class="dot" style="background:#ff9f0a;color:#ff9f0a"></i><span>20-Tage-Linie<small>Durchschnitt der letzten 20 Handelstage</small></span></span><span class="v strong">' + num(a.s20) + '</span></div>' +
    '<div class="row"><span class="l"><i class="dot" style="background:#ff453a;color:#ff453a"></i><span>30-Wochen-Linie, gestrichelt<small>' + (wInRange ? 'Langfristiger Trend' : 'Liegt außerhalb des Ausschnitts') + '</small></span></span><span class="v strong">' + num(a.w30now) + '</span></div></div>';
}

/* ---------- Ansichten ---------- */
function banner() {
  return msg ? '<div class="' + (msgType === 'err' ? 'alert' : 'ok-msg') + '">' + esc(msg) + '</div>' : '';
}
function title(t) {
  const st = S.settings;
  return '<h1>' + esc(t) + '</h1><div class="sub">' + esc(st.name || 'Noch kein ETF gewählt') + (S.cache.fetched ? ' · Stand ' + parseD(S.cache.fetched).toLocaleDateString('de-DE') : '') + '</div>';
}

function checks(a) {
  const st = S.settings;
  const rows = [
    [a.trendUp, 'Trend steigt', 'Die 30-Wochen-Linie zeigt nach oben.'],
    [a.pulled, 'Rücksetzer', 'Der Kurs liegt mind. ' + num(st.pullback, 1) + ' % unter dem 10-Tage-Hoch (jetzt ' + num(a.pull, 1) + ' %).'],
    [a.near, 'Nahe an der 20-Tage-Linie', 'Abstand ' + num(a.dist, 1) + ' % (erlaubt: −' + num(st.tolDown, 1) + ' % bis +' + num(st.tolUp, 1) + ' %).']
  ];
  return '<div class="sec">Kaufsignal</div><div class="group">' +
    rows.map(r => '<div class="row"><span class="l"><i class="chk ' + (r[0] ? 'ok' : 'no') + '">' + (r[0] ? '✓' : '–') + '</i><span>' + r[1] + '<small>' + r[2] + '</small></span></span></div>').join('') +
    '</div><div class="foot">Alle drei Punkte müssen erfüllt sein, damit die Anzeige auf „Jetzt kaufen“ springt.</div>';
}

/* Alles zum Limit an einer Stelle */
function limitCard() {
  const c = S.cache, n = usedToday(), pct = Math.min(100, n / FREE_LIMIT * 100);
  const hit = c.limitDate === ds(today());
  const rows =
    '<div class="row"><span class="k">Anfragen heute<small>Zähler nur für dieses Gerät</small></span><span class="v strong">' + n + ' von ' + FREE_LIMIT + '</span></div>' +
    '<div class="row" style="display:block;padding-top:0;min-height:0;padding-bottom:14px"><div class="bar' + (n >= FREE_LIMIT ? ' full' : '') + '"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="row"><span class="k">Status</span><span class="v strong" style="color:' + (hit ? 'var(--red)' : 'var(--green)') + '">' + (hit ? 'Limit erreicht' : 'In Ordnung') + '</span></div>' +
    '<div class="row"><span class="k">Letzter erfolgreicher Abruf</span><span class="v strong">' + (c.fetched ? parseD(c.fetched).toLocaleDateString('de-DE') : '–') + '</span></div>';
  return '<div class="sec">Datenabruf und Limit</div><div class="group">' + rows + '</div>' +
    '<div class="foot"><b>So funktioniert das Limit:</b> Der kostenlose Alpha-Vantage-Schlüssel erlaubt etwa 25 Anfragen pro Tag und 5 pro Minute. ' +
    'Eine Aktualisierung braucht 2 Anfragen (Tageskurse und Wochenkurse), eine ETF-Suche 1 Anfrage. ' +
    'Die App ruft pro Tag nur einmal automatisch ab und fragt nach einem Limit-Fehler am selben Tag nicht mehr von selbst an. ' +
    'Der Zähler zählt nur Anfragen von diesem Gerät. Hat derselbe Schlüssel auch woanders Anfragen verbraucht, kann das Limit früher erreicht sein.</div>';
}

function todayView() {
  const st = S.settings, a = analyze(), s = status(a), t = today(), win = windowOf(t);
  const days = Math.round((win.end - t) / DAY);
  const bought = S.log.find(e => e.window === win.key);
  const half = st.budget / 2;
  const winText = win.start.getDate() + '.–' + win.end.getDate() + '. ' + monShort(win.end);
  let h = title('Heute') + banner();
  h += '<div class="hero"><div class="badge ' + s.color + '">' + s.icon + '</div><b>' + esc(s.title) + '</b><span>' + esc(s.text) + '</span></div>';
  if (S.cache.error) {
    h += '<div class="alert"><b>' + (S.cache.limitDate === ds(today()) ? 'Limit erreicht' : 'Abruf fehlgeschlagen') + '</b>' + esc(S.cache.error) +
      (S.cache.detail ? '<small>Meldung von Alpha Vantage: ' + esc(S.cache.detail) + '</small>' : '') + '</div>';
  }

  h += '<div class="sec">Aktuelles Fenster</div><div class="group">' +
    '<div class="row"><span class="k">Zeitraum</span><span class="v strong">' + winText + '</span></div>' +
    '<div class="row"><span class="k">Noch</span><span class="v strong">' + (days > 0 ? days + (days === 1 ? ' Tag' : ' Tage') : 'Heute letzter Tag') + '</span></div>' +
    '<div class="row"><span class="k">Betrag</span><span class="v strong">' + num(half, 0) + ' €</span></div></div>';

  if (a) h += checks(a);

  if (bought) {
    h += '<div class="sec">Kauf</div><div class="group"><div class="row"><span class="k">Gekauft am ' + esc(bought.date) + '</span><span class="v strong">' + num(bought.price) + '</span></div></div>';
  } else if (a) {
    h += '<div class="sec">Kauf erfassen</div><div class="group">' +
      '<div class="field"><label for="bp">Kurs</label><input id="bp" inputmode="decimal" value="' + a.close.toFixed(2) + '"></div>' +
      '<div class="field"><label for="ba">Betrag in €</label><input id="ba" inputmode="decimal" value="' + half + '"></div></div>' +
      '<button class="btn" data-a="buy">Kauf speichern</button>' +
      '<div class="foot">Der Kurs ist der letzte Schlusskurs. Passe ihn an, wenn du anders gekauft hast.</div>';
  }
  if (a) h += chartCard(a);
  h += limitCard();
  h += '<button class="btn sec2" data-a="refresh">' + (busy ? 'Lädt …' : 'Kurse aktualisieren') + '</button>';
  return h;
}

function logView() {
  let h = title('Verlauf') + banner();
  if (!S.log.length) return h + '<div class="empty">Noch keine Käufe erfasst.<br>Speichere auf „Heute“ deinen ersten Kauf.</div>';
  const sh = S.log.reduce((s, e) => s + e.shares, 0);
  const inv = S.log.reduce((s, e) => s + e.amount, 0);
  const sav = S.log.reduce((s, e) => s + (e.firstPrice - e.price) * e.shares, 0);
  h += '<div class="sec">Gesamt</div><div class="group">' +
    '<div class="row"><span class="k">Investiert</span><span class="v strong">' + num(inv, 0) + ' €</span></div>' +
    '<div class="row"><span class="k">Anteile</span><span class="v strong">' + num(sh, 3) + '</span></div>' +
    '<div class="row"><span class="k">Ersparnis<small>gegenüber Kauf am ersten Fenstertag</small></span><span class="v strong">' + num(sav, 2) + '</span></div></div>';
  h += '<div class="sec">Käufe</div><div class="group">' +
    [...S.log].reverse().map(e =>
      '<div class="row"><span class="k">' + esc(e.date) + '<small>' + num(e.price) + ' · ' + num(e.shares, 3) + ' Anteile · ' + num((e.firstPrice - e.price) * e.shares, 2) + ' gespart</small></span>' +
      '<span class="v strong">' + num(e.amount, 0) + ' €</span><button class="link del" data-a="del" data-id="' + e.id + '">Löschen</button></div>'
    ).join('') + '</div>';
  return h;
}

function settingsView() {
  const st = S.settings;
  const th = [['auto', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']]
    .map(x => '<button class="' + (st.theme === x[0] ? 'on' : '') + '" data-a="theme" data-v="' + x[0] + '">' + x[1] + '</button>').join('');
  return title('Einstellungen') + banner() +
    '<div class="sec">Darstellung</div><div class="group"><div class="seg" style="margin:12px 16px 12px">' + th + '</div></div>' +
    '<div class="sec">Alpha Vantage</div><div class="group">' +
    '<div class="field"><label for="key">Schlüssel</label><input id="key" type="password" autocomplete="off" placeholder="API-Schlüssel" value="' + esc(st.apiKey) + '"></div></div>' +
    '<div class="foot">Der Schlüssel bleibt nur auf diesem Gerät. Kostenlos sind etwa 25 Anfragen pro Tag, mehr dazu auf „Heute“ unter „Datenabruf und Limit“.</div>' +
    '<div class="sec">ETF</div><div class="group">' +
    '<div class="row"><span class="k">Aktuell</span><span class="v strong">' + esc(st.symbol || 'keiner') + '</span></div>' +
    '<div class="field"><label for="q">Suche</label><input id="q" autocomplete="off" placeholder="Name, z. B. SPDR MSCI ACWI IMI"></div></div>' +
    '<button class="btn sec2" data-a="search">Suchen (1 Anfrage)</button>' +
    (results.length ? '<div class="sec">Treffer</div><div class="group">' + results.map(r =>
      '<div class="row"><span class="k">' + esc(r.symbol) + '<small>' + esc(r.name) + ' · ' + esc(r.region) + ' · ' + esc(r.currency) + '</small></span>' +
      '<button class="link" data-a="pick" data-s="' + esc(r.symbol) + '" data-n="' + esc(r.name) + '">Wählen</button></div>').join('') + '</div>' : '') +
    '<div class="sec">Strategie</div><div class="group">' +
    '<div class="field"><label for="bud">Budget pro Monat (€)</label><input id="bud" inputmode="decimal" value="' + st.budget + '"></div>' +
    '<div class="field"><label for="tu">Toleranz über 20er-Linie (%)</label><input id="tu" inputmode="decimal" value="' + st.tolUp + '"></div>' +
    '<div class="field"><label for="td">Toleranz unter 20er-Linie (%)</label><input id="td" inputmode="decimal" value="' + st.tolDown + '"></div>' +
    '<div class="field"><label for="pb">Mind. Rücksetzer (%)</label><input id="pb" inputmode="decimal" value="' + st.pullback + '"></div></div>' +
    '<button class="btn" data-a="save">Speichern</button>';
}

function tabbar() {
  const ic = {
    heute: '<svg viewBox="0 0 24 24"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>',
    verlauf: '<svg viewBox="0 0 24 24"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4.5" cy="7" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="17" r=".6"/></svg>',
    einstellungen: '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--knob)"/><circle cx="15" cy="17" r="2.4" fill="var(--knob)"/></svg>'
  };
  const t = [['heute', 'Heute'], ['verlauf', 'Verlauf'], ['einstellungen', 'Einstellungen']];
  return '<nav class="tabbar">' + t.map(x => '<button class="' + (view === x[0] ? 'on' : '') + '" data-a="tab" data-v="' + x[0] + '">' + ic[x[0]] + x[1] + '</button>').join('') + '</nav>';
}

function render() {
  const body = view === 'einstellungen' ? settingsView() : view === 'verlauf' ? logView() : todayView();
  document.getElementById('app').innerHTML = body + tabbar();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a;
  if (a !== 'search' && a !== 'refresh' && a !== 'range' && a !== 'theme') msg = '';
  if (a === 'tab') { view = t.dataset.v; window.scrollTo(0, 0); render(); }
  else if (a === 'range') { range = Number(t.dataset.n); render(); }
  else if (a === 'theme') { S.settings.theme = t.dataset.v; save(); applyTheme(); render(); }
  else if (a === 'refresh') { await refresh(true); }
  else if (a === 'buy') { buy(); }
  else if (a === 'del') {
    if (confirm('Eintrag löschen?')) { S.log = S.log.filter(x => String(x.id) !== t.dataset.id); save(); render(); }
  }
  else if (a === 'search') { await search(document.getElementById('q').value); }
  else if (a === 'pick') {
    S.settings.symbol = t.dataset.s; S.settings.name = t.dataset.n; results = [];
    msg = 'ETF gewählt.'; msgType = 'ok'; save(); view = 'heute'; await refresh(true);
  }
  else if (a === 'save') { saveSettings(); }
});

applyTheme();
if (!S.settings.apiKey || !S.settings.symbol) view = 'einstellungen';
render();
refresh(false);
</script>
</body>
</html>
