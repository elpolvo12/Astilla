name: Kurse aktualisieren

on:
  schedule:
    # Mo-Fr alle 30 Minuten von 07:00 bis 18:30 UTC (Börsenzeit). Yahoo ist die Hauptquelle, Alpha Vantage greift nur als letzter Ausweg.
    - cron: '7,37 7-18 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-quotes.mjs'
      - 'symbols.json'
      - '.github/workflows/quotes.yml'

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kurse holen
        env:
          ALPHA_KEY: ${{ secrets.ALPHA_KEY }}
        run: node scripts/fetch-quotes.mjs
      - name: Speichern
        run: |
          git config user.name "dev"
          git config user.email "dev@invalid.invalid"
          git add quotes.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderung"; else git commit -m "Kurse aktualisiert" && git push; fi
