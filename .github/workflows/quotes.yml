name: Kurse aktualisieren

on:
  schedule:
    # Alle 30 Minuten, Mo-Fr, 07:00-21:59 UTC (deckt die Xetra-Handelszeit ab)
    - cron: '*/30 7-21 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-quotes.mjs'
      - 'symbols.json'
      - '.github/workflows/quotes.yml'

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kurse holen
        run: node scripts/fetch-quotes.mjs
      - name: Speichern
        run: |
          git config user.name "dev"
          git config user.email "dev@invalid.invalid"
          git add quotes.json
          if git diff --cached --quiet; then echo "Keine Änderung"; else git commit -m "Kurse aktualisiert" && git push; fi
